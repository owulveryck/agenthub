<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHub Demo - La Grosse Conf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
   * La Grosse Conf — Neo-Brutalist Style
   * Primary #FF0F47 | Background #FFF0F5 | Text #232323 | Surface #FFFFFF
   */
  :root {
    --primary: #FF0F47;
    --bg: #FFF0F5;
    --text: #232323;
    --surface: #FFFFFF;
    --border: 1.5px solid #232323;
    --muted: #888;
    --shadow: 6px 6px 0px 0px var(--primary);
    --shadow-sm: 4px 4px 0px 0px var(--primary);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  #layout {
    display: grid;
    grid-template-rows: 1fr 2fr;
    height: 100vh;
    padding: 16px;
    gap: 16px;
  }

  /* ── Chat panel ─────────────────────────────── */
  #chat-panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-header {
    background: var(--surface);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    border-bottom: var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.02em;
  }
  .window-controls {
    display: flex;
    gap: 6px;
    margin-right: 4px;
  }
  .wdot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1.5px solid var(--text);
  }
  .wdot.red { background: var(--primary); border: none; }
  .wdot.empty { background: var(--surface); }
  .panel-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .panel-title .dot-accent { color: var(--primary); }
  .panel-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    background: var(--surface);
  }
  #chat-input-bar {
    display: flex;
    border-top: var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #chat-input-bar span {
    padding: 10px 4px 10px 14px;
    color: var(--primary);
    font-size: 15px;
    font-weight: bold;
  }
  #chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 6px;
  }
  #chat-input::placeholder { color: #aaa; }
  #upload-btn {
    background: var(--primary);
    border: var(--border);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    margin: 5px 8px 5px 0;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 3px 3px 0px 0px var(--text);
    transition: transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
  }
  #upload-btn:hover { opacity: 0.9; }
  #upload-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px 0px var(--text);
  }
  #file-input { display: none; }
  #mp3-toggle-btn {
    background: var(--surface);
    border: var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 2px 2px 0px 0px var(--primary);
    transition: transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
  }
  #mp3-toggle-btn:hover {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px 0px var(--primary);
  }
  #mp3-toggle-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg { padding: 3px 0; word-wrap: break-word; }
  .msg-user { color: var(--primary); font-weight: 500; }
  .msg-user::before { content: '> '; color: var(--primary); font-weight: 700; }
  .msg-agent { color: var(--text); }
  .msg-agent::before { content: '\1F916 '; }
  .msg-status { color: var(--muted); font-style: italic; }

  /* ── Diagram panel ──────────────────────────── */
  #diagram-panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  #diagram-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px 0;
    min-width: 0;
  }
  #diagram-container svg {
    width: 100%;
    height: auto;
    max-height: 100%;
  }
  #event-feed {
    flex-shrink: 0;
    padding: 6px 14px;
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    border-top: var(--border);
    min-height: 28px;
  }
  #event-feed span { color: #aaa; margin-right: 6px; }

  /* ── Observability links ──────────────────────── */
  .obs-links { display: flex; gap: 8px; }
  .obs-links a {
    color: var(--text);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    padding: 3px 10px;
    border: var(--border);
    border-radius: 6px;
    background: var(--surface);
    box-shadow: 2px 2px 0px 0px var(--primary);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .obs-links a:hover {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px 0px var(--primary);
  }

  /* ── Status indicator ───────────────────────── */
  #status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  #status-dot.connected    { background: #22c55e; }
  #status-dot.disconnected { background: #ccc; }
  #status-dot.connecting   { background: #f59e0b; }

  /* ── Scrollbar ──────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #bbb; }

  /* ── Agent tooltip ────────────────────────── */
  #agent-tooltip {
    display: none;
    position: fixed;
    background: var(--surface);
    border: var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 11px;
    line-height: 1.5;
    max-width: 420px;
    pointer-events: none;
    z-index: 1000;
    box-shadow: var(--shadow-sm);
  }
  #agent-tooltip .tt-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  #agent-tooltip .tt-name {
    color: var(--primary);
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14px;
  }
  #agent-tooltip .tt-version { color: var(--muted); font-size: 10px; }
  #agent-tooltip .tt-proto { color: #aaa; font-size: 10px; }
  #agent-tooltip .tt-desc { margin: 4px 0 8px; color: #555; }
  #agent-tooltip .tt-section {
    border-top: 1px solid #eee;
    padding-top: 6px;
    margin-top: 6px;
  }
  #agent-tooltip .tt-label {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 2px;
  }
  #agent-tooltip .tt-field {
    margin: 2px 0;
    color: #555;
  }
  #agent-tooltip .tt-field-key {
    color: var(--muted);
  }
  #agent-tooltip .tt-field-val {
    color: var(--text);
  }
  #agent-tooltip .tt-cap {
    display: inline-block;
    padding: 1px 6px;
    margin: 1px 3px 1px 0;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    background: #FFF0F5;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  #agent-tooltip .tt-tag {
    display: inline-block;
    padding: 1px 5px;
    margin: 1px 2px 1px 0;
    border-radius: 4px;
    font-size: 9px;
    background: #f5f5f5;
    color: var(--muted);
    border: 1px solid #ddd;
  }
  #agent-tooltip .tt-skill {
    margin: 4px 0;
    padding: 6px 8px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #eee;
  }
  #agent-tooltip .tt-skill-name { color: var(--primary); font-weight: 700; }
  #agent-tooltip .tt-skill-desc { color: #555; margin-top: 1px; }
  #agent-tooltip .tt-skill-meta { margin-top: 2px; }
  #agent-tooltip .tt-mode {
    display: inline-block;
    padding: 0 4px;
    margin: 1px 2px 1px 0;
    border-radius: 3px;
    font-size: 9px;
    background: #f0f0f0;
    color: #666;
    border: 1px solid #ddd;
  }

  /* ── Working indicator ───────────────────── */
  @keyframes agent-working {
    0%, 100% { stroke: var(--primary); stroke-width: 3; filter: drop-shadow(0 0 3px rgba(255,15,71,0.3)); }
    50%      { stroke: var(--primary); stroke-width: 3.5; filter: drop-shadow(0 0 8px rgba(255,15,71,0.6)); }
  }
  .node-working rect.node-border {
    animation: agent-working 2s ease-in-out infinite;
  }
  .working-label {
    opacity: 0;
    transition: opacity 0.3s;
  }
  .node-working .working-label {
    opacity: 1;
  }

  /* ── Draggable nodes ───────────────────────── */
  .node-draggable { cursor: grab; }
  .node-draggable:active { cursor: grabbing; }
  body.dragging { cursor: grabbing !important; user-select: none; }
  body.dragging .node-draggable { cursor: grabbing; }
</style>
</head>
<body>
<div id="layout">
  <!-- Chat -->
  <div id="chat-panel">
    <div class="panel-header">
      <div class="window-controls">
        <span class="wdot red"></span>
        <span class="wdot empty"></span>
        <span class="wdot empty"></span>
      </div>
      <span class="panel-title"><span id="status-dot" class="connecting"></span>AgentHub Chat<span class="dot-accent">.</span></span>
      <div class="panel-right">
        <span id="status-text" style="font-weight:normal;color:#aaa;font-size:11px">connecting...</span>
      </div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-bar">
      <span>&gt;</span>
      <input id="chat-input" type="text" placeholder="Type a message and press Enter..." autofocus>
      <input id="file-input" type="file" accept=".mp3,.m4a,audio/mpeg,audio/mp4,audio/x-m4a">
      <button id="upload-btn" title="Upload Audio">Upload Audio</button>
    </div>
  </div>
  <!-- Diagram -->
  <div id="diagram-panel">
    <div class="panel-header">
      <div class="window-controls">
        <span class="wdot red"></span>
        <span class="wdot empty"></span>
        <span class="wdot empty"></span>
      </div>
      <span class="panel-title">Architecture<span class="dot-accent">.</span></span>
      <div class="panel-right">
        <button id="mp3-toggle-btn">Start Audio Agent</button>
        <div class="obs-links">
          <a href="http://localhost:16686" target="_blank">Jaeger</a>
          <a href="http://localhost:3333" target="_blank">Grafana</a>
          <a href="http://localhost:9090" target="_blank">Prometheus</a>
        </div>
      </div>
    </div>
    <div id="diagram-container">
      <svg id="diagram" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3"
                  markerWidth="8" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,3 L0,6" fill="#ccc"/>
          </marker>
          <marker id="arrow-active" viewBox="0 0 10 6" refX="10" refY="3"
                  markerWidth="8" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,3 L0,6" fill="#FF0F47"/>
          </marker>
        </defs>
        <!-- Nodes and edges rendered by initDiagram() -->
      </svg>
    </div>
    <div id="event-feed"></div>
  </div>
</div>
<div id="agent-tooltip"></div>
<script>
(function() {
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var chatMessages = document.getElementById('chat-messages');
  var chatInput = document.getElementById('chat-input');
  var statusDot = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');
  var diagram = document.getElementById('diagram');
  var eventFeed = document.getElementById('event-feed');

  /* ── Theme colors (used in JS animations) ──── */
  var COL_ACCENT  = '#FF0F47';
  var COL_STROKE  = '#232323';
  var COL_LINE    = '#ccc';

  /* ── Node data model (single source of truth) ── */
  var SHADOW_DX = 5, SHADOW_DY = 5;
  var nodeData = {
    chat:   { x: 50,  y: 100, w: 165, h: 80,  rx: 10, label: 'You',           sub: 'Chat Client',  staticSub: null,       hasWorking: false },
    broker: { x: 335, y: 85,  w: 210, h: 110, rx: 12, label: 'Broker',         sub: '',             staticSub: 'Event Bus', hasWorking: false },
    cortex: { x: 670, y: 25,  w: 190, h: 80,  rx: 10, label: 'Cortex',         sub: 'Orchestrator', staticSub: null,       hasWorking: true },
    echo:   { x: 670, y: 175, w: 190, h: 80,  rx: 10, label: 'Echo Agent',     sub: 'Task Worker',  staticSub: null,       hasWorking: true }
  };

  var edgeTopology = [
    { from: 'chat',   to: 'broker' },
    { from: 'broker', to: 'cortex' },
    { from: 'broker', to: 'echo' }
  ];

  var edges = {};

  function computeEdges() {
    edges = {};
    edgeTopology.forEach(function(edge) {
      var f = nodeData[edge.from], t = nodeData[edge.to];
      edges[edge.from + '|' + edge.to] = {
        x1: f.x + f.w, y1: f.y + f.h / 2,
        x2: t.x,       y2: t.y + t.h / 2
      };
    });
  }

  /* ── SVG rendering functions ─────────────────── */
  function renderNode(id) {
    var n = nodeData[id];
    var g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('id', 'node-' + id);
    g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    g.classList.add('node-draggable');

    // Shadow rect
    var shadow = document.createElementNS(SVG_NS, 'rect');
    shadow.setAttribute('x', SHADOW_DX);
    shadow.setAttribute('y', SHADOW_DY);
    shadow.setAttribute('width', n.w);
    shadow.setAttribute('height', n.h);
    shadow.setAttribute('rx', n.rx);
    shadow.setAttribute('fill', COL_ACCENT);
    shadow.setAttribute('stroke', 'none');
    g.appendChild(shadow);

    // Border rect
    var border = document.createElementNS(SVG_NS, 'rect');
    border.setAttribute('class', 'node-border');
    border.setAttribute('x', 0);
    border.setAttribute('y', 0);
    border.setAttribute('width', n.w);
    border.setAttribute('height', n.h);
    border.setAttribute('rx', n.rx);
    border.setAttribute('fill', '#FFFFFF');
    border.setAttribute('stroke', COL_STROKE);
    border.setAttribute('stroke-width', '1.5');
    g.appendChild(border);

    // Label
    var label = document.createElementNS(SVG_NS, 'text');
    label.setAttribute('x', n.w / 2);
    label.setAttribute('y', n.h * 0.45);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('fill', COL_STROKE);
    label.setAttribute('font-size', n.h > 90 ? '18' : '16');
    label.setAttribute('font-weight', 'bold');
    label.setAttribute('font-family', "'Montserrat', sans-serif");
    label.textContent = n.label;
    g.appendChild(label);

    // Static subtitle (e.g. "Event Bus" for broker — never changes)
    if (n.staticSub) {
      var st = document.createElementNS(SVG_NS, 'text');
      st.setAttribute('x', n.w / 2);
      st.setAttribute('y', n.h * 0.6);
      st.setAttribute('text-anchor', 'middle');
      st.setAttribute('fill', '#888');
      st.setAttribute('font-size', '11');
      st.setAttribute('font-family', "'Poppins', sans-serif");
      st.textContent = n.staticSub;
      g.appendChild(st);
    }

    // Dynamic subtitle (updated via setNodeSubtext)
    var sub = document.createElementNS(SVG_NS, 'text');
    sub.setAttribute('id', 'sub-' + id);
    sub.setAttribute('x', n.w / 2);
    sub.setAttribute('y', n.staticSub ? n.h * 0.78 : n.h * 0.7);
    sub.setAttribute('text-anchor', 'middle');
    sub.setAttribute('fill', n.staticSub ? '#aaa' : '#888');
    sub.setAttribute('font-size', n.staticSub ? '9' : '10');
    sub.setAttribute('font-family', "'Poppins', sans-serif");
    sub.textContent = n.sub;
    g.appendChild(sub);

    // Working label
    if (n.hasWorking) {
      var work = document.createElementNS(SVG_NS, 'text');
      work.setAttribute('class', 'working-label');
      work.setAttribute('x', n.w / 2);
      work.setAttribute('y', n.h * 0.9);
      work.setAttribute('text-anchor', 'middle');
      work.setAttribute('fill', COL_ACCENT);
      work.setAttribute('font-size', '9');
      work.setAttribute('font-family', "'Poppins', sans-serif");
      work.textContent = 'processing...';
      g.appendChild(work);
    }

    return g;
  }

  function renderEdge(edge) {
    var f = nodeData[edge.from], t = nodeData[edge.to];
    var line = document.createElementNS(SVG_NS, 'line');
    var lineId = 'line-' + [edge.from, edge.to].sort().join('-');
    line.setAttribute('id', lineId);
    line.setAttribute('x1', f.x + f.w);
    line.setAttribute('y1', f.y + f.h / 2);
    line.setAttribute('x2', t.x);
    line.setAttribute('y2', t.y + t.h / 2);
    line.setAttribute('stroke', COL_LINE);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('marker-end', 'url(#arrow)');
    return line;
  }

  function updateEdges() {
    computeEdges();
    edgeTopology.forEach(function(edge) {
      var f = nodeData[edge.from], t = nodeData[edge.to];
      var lineId = 'line-' + [edge.from, edge.to].sort().join('-');
      var line = document.getElementById(lineId);
      if (line) {
        line.setAttribute('x1', f.x + f.w);
        line.setAttribute('y1', f.y + f.h / 2);
        line.setAttribute('x2', t.x);
        line.setAttribute('y2', t.y + t.h / 2);
      }
    });
  }

  /* ── Drag handling ───────────────────────────── */
  var dragState = null;

  function svgPoint(evt) {
    var pt = diagram.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    return pt.matrixTransform(diagram.getScreenCTM().inverse());
  }

  function onNodeMouseDown(nodeId, evt) {
    evt.preventDefault();
    var pos = svgPoint(evt);
    var n = nodeData[nodeId];
    dragState = { nodeId: nodeId, offsetX: pos.x - n.x, offsetY: pos.y - n.y };
    document.body.classList.add('dragging');
    tooltip.style.display = 'none';
  }

  function onSvgMouseMove(evt) {
    if (!dragState) return;
    var pos = svgPoint(evt);
    var n = nodeData[dragState.nodeId];
    n.x = pos.x - dragState.offsetX;
    n.y = pos.y - dragState.offsetY;
    var g = document.getElementById('node-' + dragState.nodeId);
    if (g) g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    updateEdges();
  }

  function onMouseUp() {
    if (!dragState) return;
    dragState = null;
    document.body.classList.remove('dragging');
  }

  /* ── Diagram initialization ──────────────────── */
  function initDiagram() {
    // Keep <defs>, remove everything else
    var defs = diagram.querySelector('defs');
    while (diagram.firstChild) diagram.removeChild(diagram.firstChild);
    if (defs) diagram.appendChild(defs);

    // Compute initial edges
    computeEdges();

    // Render edges first (behind nodes)
    edgeTopology.forEach(function(edge) {
      diagram.appendChild(renderEdge(edge));
    });

    // Render nodes
    var ids = Object.keys(nodeData);
    ids.forEach(function(id) {
      var g = renderNode(id);
      diagram.appendChild(g);

      // Drag handlers (mouse)
      g.addEventListener('mousedown', function(e) { onNodeMouseDown(id, e); });

      // Drag handlers (touch)
      g.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var touch = e.touches[0];
        var pos = svgPoint(touch);
        var n = nodeData[id];
        dragState = { nodeId: id, offsetX: pos.x - n.x, offsetY: pos.y - n.y };
        document.body.classList.add('dragging');
        tooltip.style.display = 'none';
      }, { passive: false });

      // Tooltip handlers
      g.addEventListener('mouseenter', function(e) { if (!dragState) showTooltip(id, e); });
      g.addEventListener('mousemove', function(e) { if (!dragState) positionTooltip(e); });
      g.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });
    });

    // SVG-level move handlers
    diagram.addEventListener('mousemove', onSvgMouseMove);
    diagram.addEventListener('touchmove', function(e) {
      if (!dragState) return;
      e.preventDefault();
      onSvgMouseMove(e.touches[0]);
    }, { passive: false });

    // Global release handlers
    document.addEventListener('mouseup', onMouseUp);
    document.addEventListener('touchend', onMouseUp);
  }

  function getPath(from, to) {
    var k1 = from + '|' + to, k2 = to + '|' + from;
    if (edges[k1]) return { sx: edges[k1].x1, sy: edges[k1].y1, ex: edges[k1].x2, ey: edges[k1].y2 };
    if (edges[k2]) return { sx: edges[k2].x2, sy: edges[k2].y2, ex: edges[k2].x1, ey: edges[k2].y1 };
    return null;
  }

  function agentToNode(name) {
    if (!name) return null;
    var n = name.toLowerCase();
    if (n.indexOf('demo_web') >= 0 || n.indexOf('chat') >= 0) return 'chat';
    if (n.indexOf('cortex') >= 0) return 'cortex';
    if (n.indexOf('mp3') >= 0) return 'mp3';
    if (n.indexOf('echo') >= 0) return 'echo';
    return null;
  }

  /* ── SVG animation engine ──────────────────── */
  function animateDot(from, to, dur, cb) {
    var p = getPath(from, to);
    if (!p) { if (cb) cb(); return; }

    // Highlight the connection line
    var lineId = 'line-' + [from, to].sort().join('-');
    var line = document.getElementById(lineId);
    if (line) {
      line.setAttribute('stroke', COL_ACCENT);
      line.setAttribute('stroke-width', '3');
      line.setAttribute('marker-end', 'url(#arrow-active)');
    }

    var circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('r', '7');
    circle.setAttribute('fill', COL_ACCENT);
    circle.setAttribute('filter', 'url(#glow)');
    circle.setAttribute('cx', p.sx);
    circle.setAttribute('cy', p.sy);
    diagram.appendChild(circle);

    var start = null;
    function frame(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / dur, 1);
      // ease-out cubic
      var e = 1 - Math.pow(1 - t, 3);
      circle.setAttribute('cx', p.sx + (p.ex - p.sx) * e);
      circle.setAttribute('cy', p.sy + (p.ey - p.sy) * e);
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        circle.remove();
        // Reset line
        if (line) {
          setTimeout(function() {
            line.setAttribute('stroke', COL_LINE);
            line.setAttribute('stroke-width', '2');
            line.setAttribute('marker-end', 'url(#arrow)');
          }, 500);
        }
        if (cb) cb();
      }
    }
    requestAnimationFrame(frame);
  }

  function highlightNode(nodeId, durationMs) {
    var g = document.getElementById('node-' + nodeId);
    if (!g) return;
    var rect = g.querySelector('rect.node-border');
    if (!rect) return;
    rect.setAttribute('stroke', COL_ACCENT);
    rect.setAttribute('stroke-width', '3');
    setTimeout(function() {
      rect.setAttribute('stroke', COL_STROKE);
      rect.setAttribute('stroke-width', '1.5');
    }, durationMs || 2000);
  }

  function setNodeSubtext(nodeId, text) {
    var el = document.getElementById('sub-' + nodeId);
    if (el) el.textContent = text;
  }

  /* ── Working state tracking ──────────────── */
  var workingAgents = {};

  function setNodeWorking(nodeId) {
    var g = document.getElementById('node-' + nodeId);
    if (!g) return;
    g.classList.add('node-working');
    workingAgents[nodeId] = true;
  }

  function clearNodeWorking(nodeId) {
    var g = document.getElementById('node-' + nodeId);
    if (!g) return;
    g.classList.remove('node-working');
    delete workingAgents[nodeId];
  }

  /* ── Routing: multi-hop dot through broker ─── */
  function sendDotRoute(from, to) {
    if (!from || !to) return;
    if (from === to) { highlightNode(from, 2000); return; }

    highlightNode(from, 3000);

    if (from === 'broker') {
      animateDot('broker', to, 1000, function() { highlightNode(to, 2000); });
    } else if (to === 'broker') {
      animateDot(from, 'broker', 1000, function() { highlightNode('broker', 2000); });
    } else {
      // Multi-hop: from → broker → to
      animateDot(from, 'broker', 800, function() {
        highlightNode('broker', 1500);
        setTimeout(function() {
          animateDot('broker', to, 800, function() { highlightNode(to, 2000); });
        }, 300);
      });
    }
  }

  /* ── Map event source to node id ────────────── */
  function sourceToNode(source) {
    if (source === 'broker') return 'broker';
    if (source === 'cortex') return 'cortex';
    if (source === 'echo_agent') return 'echo';
    if (source === 'mp3_agent') return 'mp3';
    return null;
  }

  /* ── Event feed (compact bottom strip) ──────── */
  var ICONS = { 'in':'\u2193','out':'\u2191','route':'\u2192','ok':'\u2713','err':'\u2717','info':'\u25CF' };

  function addToFeed(msg) {
    var icon = ICONS[msg.icon] || '\u25CF';
    var t = msg.time ? msg.time + ' ' : '';
    var html = '<span>' + t + '</span>' + icon + ' '
      + escapeHtml(msg.source) + ' \u2014 ' + escapeHtml(msg.content);
    if (msg.detail) html += '  <span>' + escapeHtml(msg.detail) + '</span>';
    eventFeed.innerHTML = html;
  }

  /* ── Handle incoming events ─────────────────── */
  function handleEvent(msg) {
    addToFeed(msg);
    var node = sourceToNode(msg.source);

    // Track working state on agent nodes
    if (node && msg.content) {
      if (msg.content.indexOf('Processing task') >= 0) {
        setNodeWorking(node);
      } else if (msg.content.indexOf('Task completed') >= 0 || msg.content.indexOf('Task failed') >= 0) {
        clearNodeWorking(node);
      }
    }

    // Broker "Message received" with routing detail "from → to"
    if (msg.source === 'broker' && msg.content === 'Message received' && msg.detail) {
      var parts = msg.detail.split(' \u2192 ');
      if (parts.length === 2) {
        var from = agentToNode(parts[0]);
        var to = agentToNode(parts[1]);
        if (from && to) {
          sendDotRoute(from, to);
          return;
        }
      }
    }

    // Broker "Message routed" — just flash broker
    if (msg.source === 'broker' && msg.content === 'Message routed') {
      highlightNode('broker', 1500);
      setNodeSubtext('broker', msg.detail || '');
      return;
    }

    // Broker registration events — flash broker
    if (msg.source === 'broker' && (msg.content === 'Agent registered' || msg.content === 'Agent connected')) {
      highlightNode('broker', 2000);
      var registered = agentToNode(msg.detail);
      if (registered) {
        animateDot(registered, 'broker', 1000, function() {
          highlightNode('broker', 1500);
        });
      }
      return;
    }

    // Agent events — highlight the agent node
    if (node) {
      highlightNode(node, 2000);
      if (msg.icon === 'ok' || msg.icon === 'info') {
        setNodeSubtext(node, msg.content);
      }
    }
  }

  /* ── Utilities ──────────────────────────────── */
  function escapeHtml(text) {
    if (!text) return '';
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  }

  function appendHtml(panel, html) {
    var wasNearBottom = isNearBottom(panel);
    var div = document.createElement('div');
    div.innerHTML = html;
    panel.appendChild(div);
    while (panel.children.length > 300) panel.removeChild(panel.firstChild);
    if (wasNearBottom) panel.scrollTop = panel.scrollHeight;
  }

  /* ── WebSocket ──────────────────────────────── */
  var ws = null, reconnectTimer = null;

  function setStatus(state) {
    statusDot.className = state;
    statusText.textContent = state;
  }

  function connect() {
    if (ws) { ws.close(); ws = null; }
    setStatus('connecting');
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function() {
      setStatus('connected');
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };
    ws.onclose = function() {
      setStatus('disconnected'); ws = null;
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = function() { setStatus('disconnected'); };

    ws.onmessage = function(evt) {
      var msg;
      try { msg = JSON.parse(evt.data); } catch(e) { return; }
      switch (msg.type) {
        case 'event':
          handleEvent(msg);
          break;
        case 'chat_response':
          appendHtml(chatMessages,
            '<div class="msg msg-agent">' + escapeHtml(msg.content) + '</div>');
          break;
        case 'agent_card':
          if (msg.source && msg.agent_card) {
            agentCards[agentToNode(msg.source)] = msg.agent_card;
          }
          break;
        case 'status':
          appendHtml(chatMessages,
            '<div class="msg msg-status">[' + escapeHtml(msg.source || 'system') + '] '
            + escapeHtml(msg.content) + '</div>');
          break;
      }
    };
  }

  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      appendHtml(chatMessages,
        '<div class="msg msg-user">' + escapeHtml(text) + '</div>');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'chat_message', content: text }));
      }
    }
  });

  connect();

  /* ── Agent card tooltips ────────────────────── */
  var agentCards = {
    chat: {
      name: 'You',
      description: 'Chat client interface for interacting with AgentHub agents',
      version: '1.0.0',
      protocol_version: '0.2.1',
      url: 'grpc://localhost:50051',
      preferred_transport: 'grpc',
      provider: { organization: 'OCTO Technology', url: 'https://octo.com' },
      capabilities: { streaming: true, push_notifications: false },
      skills: []
    },
    broker: {
      name: 'Broker',
      description: 'Central event bus for agent-to-agent communication',
      version: '1.0.0',
      protocol_version: '0.2.1',
      url: 'grpc://localhost:50051',
      preferred_transport: 'grpc',
      provider: { organization: 'OCTO Technology', url: 'https://octo.com' },
      capabilities: { streaming: true, push_notifications: true },
      skills: []
    },
    cortex: {
      name: 'Cortex',
      description: 'Orchestrator that analyzes user intent and dispatches tasks to specialized agents',
      version: '1.0.0',
      protocol_version: '0.2.1',
      url: 'grpc://localhost:50051',
      preferred_transport: 'grpc',
      provider: { organization: 'OCTO Technology', url: 'https://octo.com' },
      capabilities: { streaming: true, push_notifications: false },
      skills: [
        {
          id: 'intent_analysis',
          name: 'Intent Analysis',
          description: 'Analyzes user messages to determine intent and route to appropriate agent',
          tags: ['nlp', 'routing', 'orchestration'],
          examples: ['Analyze this audio file', 'Hello world'],
          input_modes: ['text/plain'],
          output_modes: ['text/plain']
        }
      ]
    },
    echo: {
      name: 'Echo Agent',
      description: 'Task worker that echoes back messages for testing and debugging',
      version: '1.0.0',
      protocol_version: '0.2.1',
      url: 'grpc://localhost:50051',
      preferred_transport: 'grpc',
      provider: { organization: 'OCTO Technology', url: 'https://octo.com' },
      capabilities: { streaming: false, push_notifications: false },
      skills: [
        {
          id: 'echo',
          name: 'Echo',
          description: 'Echoes back any received message',
          tags: ['debug', 'test'],
          examples: ['Hello world'],
          input_modes: ['text/plain'],
          output_modes: ['text/plain']
        }
      ]
    },
    mp3: {
      name: 'Audio Analyzer',
      description: 'Task worker that analyzes audio files using AI',
      version: '1.0.0',
      protocol_version: '0.2.1',
      url: 'grpc://localhost:50051',
      preferred_transport: 'grpc',
      provider: { organization: 'OCTO Technology', url: 'https://octo.com' },
      capabilities: { streaming: false, push_notifications: false },
      skills: [
        {
          id: 'audio_analysis',
          name: 'Audio Analysis',
          description: 'Analyzes MP3/M4A audio files and provides text summary',
          tags: ['audio', 'ai', 'analysis'],
          examples: ['Analyze this audio file: /path/to/file.mp3'],
          input_modes: ['audio/mpeg', 'audio/mp4'],
          output_modes: ['text/plain']
        }
      ]
    }
  };
  var tooltip = document.getElementById('agent-tooltip');

  function showTooltip(nodeId, e) {
    var card = agentCards[nodeId];
    if (!card) return;
    var html = '';

    // Header: name + version + protocol
    html += '<div class="tt-header">';
    html += '<span class="tt-name">' + escapeHtml(card.name) + '</span>';
    if (card.version) html += '<span class="tt-version">v' + escapeHtml(card.version) + '</span>';
    if (card.protocol_version) html += '<span class="tt-proto">A2A ' + escapeHtml(card.protocol_version) + '</span>';
    html += '</div>';

    // Description
    html += '<div class="tt-desc">' + escapeHtml(card.description) + '</div>';

    // Provider + transport
    html += '<div class="tt-section">';
    html += '<div class="tt-label">Agent Info</div>';
    if (card.provider) {
      html += '<div class="tt-field"><span class="tt-field-key">provider: </span><span class="tt-field-val">' + escapeHtml(card.provider.organization) + '</span></div>';
    }
    if (card.url) {
      html += '<div class="tt-field"><span class="tt-field-key">url: </span><span class="tt-field-val">' + escapeHtml(card.url) + '</span></div>';
    }
    if (card.preferred_transport) {
      html += '<div class="tt-field"><span class="tt-field-key">transport: </span><span class="tt-field-val">' + escapeHtml(card.preferred_transport) + '</span></div>';
    }
    html += '</div>';

    // Capabilities
    if (card.capabilities) {
      html += '<div class="tt-section">';
      html += '<div class="tt-label">Capabilities</div>';
      html += '<div>';
      if (card.capabilities.streaming) html += '<span class="tt-cap">streaming</span>';
      if (card.capabilities.push_notifications) html += '<span class="tt-cap">push notifications</span>';
      if (!card.capabilities.streaming && !card.capabilities.push_notifications) {
        html += '<span style="color:#aaa">none</span>';
      }
      html += '</div></div>';
    }

    // Skills
    if (card.skills && card.skills.length > 0) {
      html += '<div class="tt-section">';
      html += '<div class="tt-label">Skills</div>';
      for (var i = 0; i < card.skills.length; i++) {
        var s = card.skills[i];
        html += '<div class="tt-skill">';
        html += '<div><span class="tt-skill-name">' + escapeHtml(s.name) + '</span>';
        if (s.id) html += ' <span style="color:#aaa">(' + escapeHtml(s.id) + ')</span>';
        html += '</div>';
        if (s.description) html += '<div class="tt-skill-desc">' + escapeHtml(s.description) + '</div>';
        if (s.tags && s.tags.length > 0) {
          html += '<div class="tt-skill-meta">';
          for (var t = 0; t < s.tags.length; t++) {
            html += '<span class="tt-tag">' + escapeHtml(s.tags[t]) + '</span>';
          }
          html += '</div>';
        }
        if (s.input_modes && s.input_modes.length > 0) {
          html += '<div class="tt-skill-meta"><span class="tt-field-key">in: </span>';
          for (var m = 0; m < s.input_modes.length; m++) {
            html += '<span class="tt-mode">' + escapeHtml(s.input_modes[m]) + '</span>';
          }
          html += '</div>';
        }
        if (s.output_modes && s.output_modes.length > 0) {
          html += '<div class="tt-skill-meta"><span class="tt-field-key">out: </span>';
          for (var o = 0; o < s.output_modes.length; o++) {
            html += '<span class="tt-mode">' + escapeHtml(s.output_modes[o]) + '</span>';
          }
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }

    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    positionTooltip(e);
  }

  function positionTooltip(e) {
    var x = e.clientX + 12, y = e.clientY + 12;
    var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    if (x + tw > window.innerWidth - 8) x = e.clientX - tw - 12;
    if (y + th > window.innerHeight - 8) y = e.clientY - th - 12;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }

  // Tooltip attachment is handled by initDiagram()

  /* ── File upload ────────────────────────────── */
  var uploadBtn = document.getElementById('upload-btn');
  var fileInput = document.getElementById('file-input');

  uploadBtn.addEventListener('click', function() {
    fileInput.click();
  });

  fileInput.addEventListener('change', function() {
    var file = fileInput.files[0];
    if (!file) return;

    var formData = new FormData();
    formData.append('file', file);

    appendHtml(chatMessages,
      '<div class="msg msg-status">Uploading ' + escapeHtml(file.name) + '...</div>');

    fetch('/upload', { method: 'POST', body: formData })
      .then(function(resp) {
        if (!resp.ok) throw new Error('Upload failed: ' + resp.status);
        return resp.json();
      })
      .then(function(data) {
        var msg = 'Analyze this audio file: ' + data.path;
        appendHtml(chatMessages,
          '<div class="msg msg-user">' + escapeHtml(msg) + '</div>');
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'chat_message', content: msg }));
        }
      })
      .catch(function(err) {
        appendHtml(chatMessages,
          '<div class="msg msg-status">Upload error: ' + escapeHtml(err.message) + '</div>');
      });

    fileInput.value = '';
  });

  /* ── Mp3 agent toggle ─────────────────────────── */
  var mp3Running = false;
  var mp3ToggleBtn = document.getElementById('mp3-toggle-btn');

  var mp3NodeDef = { x: 670, y: 270, w: 190, h: 80, rx: 10, label: 'Audio Analyzer', sub: 'Task Worker', staticSub: null, hasWorking: true };

  function addMp3Node() {
    nodeData.mp3 = { x: mp3NodeDef.x, y: mp3NodeDef.y, w: mp3NodeDef.w, h: mp3NodeDef.h, rx: mp3NodeDef.rx, label: mp3NodeDef.label, sub: mp3NodeDef.sub, staticSub: mp3NodeDef.staticSub, hasWorking: mp3NodeDef.hasWorking };
    edgeTopology.push({ from: 'broker', to: 'mp3' });
    computeEdges();

    // Render edge
    var edgeDef = { from: 'broker', to: 'mp3' };
    var lineEl = renderEdge(edgeDef);
    // Insert edge before the first node group so it renders behind nodes
    var firstNode = diagram.querySelector('g');
    if (firstNode) {
      diagram.insertBefore(lineEl, firstNode);
    } else {
      diagram.appendChild(lineEl);
    }

    // Render node
    var g = renderNode('mp3');
    diagram.appendChild(g);

    // Attach drag handlers
    g.addEventListener('mousedown', function(e) { onNodeMouseDown('mp3', e); });
    g.addEventListener('touchstart', function(e) {
      e.preventDefault();
      var touch = e.touches[0];
      var pos = svgPoint(touch);
      var n = nodeData['mp3'];
      dragState = { nodeId: 'mp3', offsetX: pos.x - n.x, offsetY: pos.y - n.y };
      document.body.classList.add('dragging');
      tooltip.style.display = 'none';
    }, { passive: false });

    // Attach tooltip handlers
    g.addEventListener('mouseenter', function(e) { if (!dragState) showTooltip('mp3', e); });
    g.addEventListener('mousemove', function(e) { if (!dragState) positionTooltip(e); });
    g.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });

    updateEdges();
  }

  function removeMp3Node() {
    var nodeEl = document.getElementById('node-mp3');
    if (nodeEl) nodeEl.remove();
    var lineEl = document.getElementById('line-broker-mp3');
    if (lineEl) lineEl.remove();
    delete nodeData.mp3;
    edgeTopology = edgeTopology.filter(function(e) { return !(e.from === 'broker' && e.to === 'mp3'); });
    computeEdges();
  }

  function toggleMp3Agent() {
    mp3ToggleBtn.disabled = true;
    mp3ToggleBtn.textContent = mp3Running ? 'Stopping...' : 'Starting...';

    var url = mp3Running ? '/agent/mp3/stop' : '/agent/mp3/start';
    fetch(url, { method: 'POST' })
      .then(function(resp) {
        if (!resp.ok) throw new Error('Failed');
        mp3Running = !mp3Running;
        if (mp3Running) {
          addMp3Node();
        } else {
          removeMp3Node();
        }
        mp3ToggleBtn.textContent = mp3Running ? 'Stop Audio Agent' : 'Start Audio Agent';
      })
      .catch(function(err) {
        mp3ToggleBtn.textContent = mp3Running ? 'Stop Audio Agent' : 'Start Audio Agent';
      })
      .finally(function() { mp3ToggleBtn.disabled = false; });
  }

  mp3ToggleBtn.addEventListener('click', toggleMp3Agent);

  /* ── Initialize the diagram ──────────────────── */
  initDiagram();
})();
</script>
